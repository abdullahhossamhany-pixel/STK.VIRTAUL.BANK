<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Services Store</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h1 { text-align: center; color: #333; margin-top: 0; }
    .nav-tabs { display: flex; justify-content: space-around; margin-bottom: 20px; }
    .tab-btn { padding: 10px 15px; cursor: pointer; border: none; background: #e0e0e0; border-radius: 5px; font-weight: bold; }
    .tab-btn.active { background: #007bff; color: #fff; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    button.submit-btn { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>
<div class="container">
  <h1>Digital Store</h1>
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('cards')">Virtual Cards</button>
    <button class="tab-btn" onclick="switchTab('giftcards')">Gift Cards & Top-Up</button>
    <button class="tab-btn" onclick="switchTab('esim')">eSIM</button>
  </div>

  <div id="cards" class="tab-content active">
    <form id="cardForm">
      <div class="form-group"><label>First Name</label><input type="text" id="cardFirstName" required></div>
      <div class="form-group"><label>Last Name</label><input type="text" id="cardLastName" required></div>
      <div class="form-group"><label>Amount (USD)</label><input type="number" id="cardAmount" value="15" min="10" required></div>
      <button type="submit" class="submit-btn">Buy Card</button>
    </form>
  </div>

  <div id="giftcards" class="tab-content">
    <form id="giftForm">
      <div class="form-group"><label>Email Address</label><input type="email" id="giftEmail" required></div>
      <div class="form-group">
        <label>Service / Provider</label>
        <select id="giftBrand">
          <option value="iTunes">iTunes / App Store</option>
          <option value="STC">STC Saudi Recharge</option>
          <option value="Mobily">Mobily Saudi Recharge</option>
          <option value="PlayStation">PlayStation Network</option>
        </select>
      </div>
      <div class="form-group"><label>Amount (USD)</label><input type="number" id="giftAmount" value="10" required></div>
      <button type="submit" class="submit-btn">Buy Gift Card / Top-Up</button>
    </form>
  </div>

  <div id="esim" class="tab-content">
    <form id="esimForm">
      <div class="form-group">
        <label>Country</label>
        <select id="esimCountry">
          <option value="SA">Saudi Arabia</option>
          <option value="US">United States</option>
          <option value="GLOBAL">Global Coverage</option>
        </select>
      </div>
      <div class="form-group">
        <label>Data Plan</label>
        <select id="esimPlan">
          <option value="1GB_7D">1 GB - 7 Days</option>
          <option value="3GB_30D">3 GB - 30 Days</option>
          <option value="10GB_30D">10 GB - 30 Days</option>
        </select>
      </div>
      <button type="submit" class="submit-btn">Buy eSIM Plan</button>
    </form>
  </div>
</div>

<script>
  function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    event.currentTarget.classList.add('active');
  }

  document.getElementById('cardForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const res = await fetch('/api/create-payment', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        amount: document.getElementById('cardAmount').value,
        firstName: document.getElementById('cardFirstName').value,
        lastName: document.getElementById('cardLastName').value
      })
    });
    const data = await res.json();
    if(data.invoice_url) window.location.href = data.invoice_url;
  });
</script>
</body>
</html>
